services:
  db:
    image: postgres:18
    container_name: proyecto1_bd1_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Proyecto1_BD1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d/ddl
      - ./sql/dml:/docker-entrypoint-initdb.d/dml
volumes:
  postgres_data:
